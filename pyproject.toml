
[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-market-lab"
version = "0.1.0"
description = "Python Kafka learning project for market event streaming"
requires-python = ">=3.14,<3.15"

dependencies = [
    "confluent-kafka==2.16.2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "orjson>=3.10,<4",
    "colorlog>=6.9,<7",
]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
market-lab = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false
